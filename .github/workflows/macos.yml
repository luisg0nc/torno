name: macOS

on:
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**']
  push:
    branches: [main]
    paths-ignore: ['docs/**']
  workflow_dispatch:
    inputs:
      e2e:
        description: Also run the Playwright suite
        type: boolean
        default: false
      package:
        description: Also make torno.app and run the smoke test against it
        type: boolean
        default: false

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: kernel/uv.lock
      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/electron
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -C app typecheck
      - name: App unit tests
        if: ${{ !cancelled() }}
        run: pnpm test
      - name: Kernel tests
        if: ${{ !cancelled() }}
        working-directory: kernel
        run: uv run --locked pytest -q
      - name: App against the kernel
        if: ${{ !cancelled() }}
        run: pnpm test:kernel
      - name: End to end
        id: e2e
        if: ${{ !cancelled() && inputs.e2e }}
        run: pnpm test:e2e
      - name: Upload e2e results
        if: ${{ !cancelled() && steps.e2e.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: app/e2e/.results

  # torno.app: only when asked for (`gh workflow run macos.yml -f package=true`), never on a push or a pull request:
  # macOS minutes cost ten times, and this account's ran out within hours of the port.
  package:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.package }}
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: kernel/uv.lock
      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/electron
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile

      - name: Make torno.app
        run: pnpm dist:mac
      - name: Signature
        run: |
          app=app/dist/mac-arm64/torno.app
          codesign -dv --verbose=2 "$app" 2>&1 | tee signature.txt
          grep -q 'Signature=adhoc' signature.txt
          codesign --verify --deep --strict "$app"
      - name: Smoke test of torno.app
        run: pnpm -C app exec playwright test e2e/packaged.spec.ts
        env:
          TORNO_PACKAGED: ${{ github.workspace }}/app/dist/mac-arm64/torno.app/Contents/MacOS/torno
      - name: The signature still holds after the run
        run: codesign --verify --deep --strict app/dist/mac-arm64/torno.app
      - name: Upload torno.app
        uses: actions/upload-artifact@v4
        with:
          name: torno-mac
          path: app/dist/*.zip
          retention-days: 7
      - name: Upload e2e results
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-package
          path: app/e2e/.results
